name: macOS Build & Packaging CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Toolchain
        run: |
          echo "🔍 Detecting installed Xcode versions..."
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Build & Package AeroSync.app & DMG
        run: |
          cd AeroSync-macOS
          chmod +x build_app.sh
          ./build_app.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroSync-macOS-v1.0.0
          path: |
            AeroSync-macOS/build/AeroSync.dmg
            AeroSync-macOS/build/AeroSync.app
